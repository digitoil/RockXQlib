# Chat2DB 配置文件
# 用于配置Chat2DB桌面客户端的各种参数

chat2db:
  # 基本配置
  auto_start: true
  port: 10824
  executable_path: ""  # 留空自动检测，或指定完整路径
  
  # 数据目录
  data_dir: "data/chat2db"
  log_dir: "logs/chat2db"
  
  # AI功能配置
  ai_features:
    enabled: true
    model: "gpt-3.5-turbo"
    api_key: ""  # 需要用户配置OpenAI API Key
    max_tokens: 2000
    temperature: 0.7
    timeout: 30
    
    # 支持的AI模型
    supported_models:
      - "gpt-3.5-turbo"
      - "gpt-4"
      - "gpt-4-turbo"
      - "claude-3-sonnet"
      - "claude-3-opus"
    
    # 量化分析专用提示词
    quant_prompts:
      - "请生成SQL查询语句来分析股票数据"
      - "请优化这个量化分析SQL查询"
      - "请解释这个SQL查询的执行计划"
      - "请生成技术指标计算的SQL语句"
  
  # 安全配置
  security:
    enable_auth: false
    username: ""
    password: ""
    ssl_enabled: false
    ssl_cert_path: ""
    ssl_key_path: ""
    
  # 数据库连接配置
  database_connections:
    # 自动发现本地数据库
    auto_discover: true
    
    # 默认连接配置
    defaults:
      timeout: 30
      max_connections: 10
      retry_count: 3
      
    # 支持的数据库类型
    supported_types:
      - "sqlite"
      - "mysql"
      - "postgresql"
      - "mongodb"
      - "redis"
      - "oracle"
      - "sqlserver"
      - "clickhouse"
  
  # 界面配置
  ui:
    theme: "dark"  # dark, light, auto
    language: "zh-CN"  # zh-CN, en-US
    font_size: 14
    auto_save: true
    auto_save_interval: 30  # 秒
    
  # 查询配置
  query:
    max_results: 1000
    timeout: 30
    auto_limit: true
    show_execution_plan: true
    enable_ai_suggestions: true
    
  # 导出配置
  export:
    default_format: "csv"  # csv, excel, json, sql
    include_headers: true
    encoding: "utf-8"
    
  # 日志配置
  logging:
    level: "INFO"  # DEBUG, INFO, WARN, ERROR
    file: "logs/chat2db.log"
    max_size: "10MB"
    backup_count: 5
    console_output: true
    
  # 性能配置
  performance:
    cache_enabled: true
    cache_size: "100MB"
    cache_ttl: 3600  # 秒
    query_optimization: true
    parallel_queries: true
    max_parallel_queries: 5

# RockXQlib集成配置
rockxqlib_integration:
  # 自动启动配置
  auto_start_chat2db: true
  auto_connect_databases: true
  
  # 数据同步配置
  sync:
    enabled: true
    interval: 60  # 秒
    tables:
      - "market_data"
      - "strategy_config"
      - "backtest_result"
      - "user_config"
    
  # 量化分析增强
  quant_enhancements:
    # 预定义查询模板
    query_templates:
      - name: "股票行情查询"
        category: "market_data"
        template: "SELECT * FROM market_data WHERE symbol = '{symbol}' AND datetime BETWEEN '{start_date}' AND '{end_date}'"
        
      - name: "策略回测结果"
        category: "strategy"
        template: "SELECT * FROM backtest_result WHERE strategy_name = '{strategy_name}' ORDER BY created_time DESC"
        
      - name: "技术指标计算"
        category: "analysis"
        template: "SELECT symbol, datetime, close, AVG(close) OVER (PARTITION BY symbol ORDER BY datetime ROWS BETWEEN {window-1} PRECEDING AND CURRENT ROW) as ma_{window} FROM market_data WHERE symbol = '{symbol}'"
    
    # AI提示词模板
    ai_prompts:
      - "请为量化分析生成SQL查询"
      - "请优化这个技术指标计算查询"
      - "请生成风险分析相关的SQL语句"
      - "请解释这个回测结果查询的含义"
    
    # 数据可视化配置
    visualization:
      enabled: true
      chart_types:
        - "line"
        - "candlestick"
        - "bar"
        - "scatter"
      default_chart: "line"
      auto_refresh: true
      refresh_interval: 30  # 秒

# 开发配置
development:
  debug_mode: false
  hot_reload: false
  verbose_logging: false
  mock_ai_responses: false
