# Trading System SQL Templates
# 交易系统SQL模板

templates:
  - name: "交易记录查询"
    category: "trading_records"
    description: "查询交易记录"
    template: "SELECT trade_id, symbol, side, quantity, price, timestamp, status FROM trades WHERE symbol = '{symbol}' AND timestamp BETWEEN '{start_time}' AND '{end_time}' ORDER BY timestamp DESC"
    parameters: ["symbol", "start_time", "end_time"]
    example: "查询平安银行最近一周的交易记录"
    system_types: ["trading", "backtest"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "easy"
    tags: ["交易", "记录", "查询"]

  - name: "持仓分析"
    category: "position_analysis"
    description: "分析持仓情况"
    template: "SELECT symbol, SUM(CASE WHEN side = 'BUY' THEN quantity ELSE -quantity END) as net_position, AVG(price) as avg_price FROM trades WHERE account_id = '{account_id}' GROUP BY symbol HAVING net_position != 0"
    parameters: ["account_id"]
    example: "分析账户的持仓情况"
    system_types: ["trading", "portfolio"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "medium"
    tags: ["持仓", "分析", "交易"]

  - name: "订单状态查询"
    category: "order_status"
    description: "查询订单状态"
    template: "SELECT order_id, symbol, side, quantity, price, status, created_time, updated_time FROM orders WHERE status = '{status}' AND created_time >= '{start_date}' ORDER BY created_time DESC"
    parameters: ["status", "start_date"]
    example: "查询所有待执行的订单"
    system_types: ["trading"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "easy"
    tags: ["订单", "状态", "查询"]

  - name: "账户资金分析"
    category: "account_analysis"
    description: "分析账户资金情况"
    template: "SELECT account_id, SUM(CASE WHEN type = 'DEPOSIT' THEN amount ELSE -amount END) as net_balance, COUNT(*) as transaction_count FROM account_transactions WHERE account_id = '{account_id}' AND date >= '{start_date}' GROUP BY account_id"
    parameters: ["account_id", "start_date"]
    example: "分析账户的资金变动情况"
    system_types: ["trading", "portfolio"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "medium"
    tags: ["账户", "资金", "分析"]

  - name: "交易统计"
    category: "trading_statistics"
    description: "统计交易数据"
    template: "SELECT symbol, COUNT(*) as trade_count, SUM(quantity) as total_volume, AVG(price) as avg_price, SUM(quantity * price) as total_value FROM trades WHERE timestamp BETWEEN '{start_time}' AND '{end_time}' GROUP BY symbol ORDER BY total_value DESC"
    parameters: ["start_time", "end_time"]
    example: "统计最近一个月的交易数据"
    system_types: ["trading", "backtest"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "medium"
    tags: ["交易", "统计", "分析"]

