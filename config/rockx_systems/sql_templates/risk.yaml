# Risk Management System SQL Templates
# 风险管理系统SQL模板

templates:
  - name: "风险指标计算"
    category: "risk_metrics"
    description: "计算风险指标"
    template: "SELECT symbol, datetime, close, STDDEV(close) OVER (ORDER BY datetime ROWS BETWEEN {window-1} PRECEDING AND CURRENT ROW) as volatility FROM market_data WHERE symbol = '{symbol}' ORDER BY datetime"
    parameters: ["symbol", "window"]
    example: "计算股票波动率"
    system_types: ["risk", "portfolio", "qlib"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "medium"
    tags: ["风险", "波动率", "指标"]

  - name: "VaR计算"
    category: "risk_metrics"
    description: "计算风险价值(VaR)"
    template: "WITH returns AS (SELECT symbol, datetime, (close - LAG(close) OVER (ORDER BY datetime)) / LAG(close) OVER (ORDER BY datetime) as return_rate FROM market_data WHERE symbol = '{symbol}') SELECT PERCENTILE_CONT({confidence_level}) WITHIN GROUP (ORDER BY return_rate) as var FROM returns"
    parameters: ["symbol", "confidence_level"]
    example: "计算95%置信度的VaR"
    system_types: ["risk", "portfolio"]
    database_types: ["postgresql", "mysql"]
    difficulty: "hard"
    tags: ["VaR", "风险", "统计"]

  - name: "压力测试分析"
    category: "stress_testing"
    description: "压力测试分析"
    template: "SELECT scenario_name, portfolio_value, loss_amount, loss_percentage FROM stress_test_results WHERE test_date = '{test_date}' AND scenario_name = '{scenario_name}' ORDER BY loss_percentage DESC"
    parameters: ["test_date", "scenario_name"]
    example: "分析特定压力测试场景的结果"
    system_types: ["risk", "portfolio"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "medium"
    tags: ["压力测试", "风险", "分析"]

  - name: "风险限额监控"
    category: "limit_monitoring"
    description: "监控风险限额"
    template: "SELECT symbol, current_exposure, limit_amount, (current_exposure / limit_amount * 100) as utilization_percent FROM risk_limits WHERE current_exposure > (limit_amount * {threshold}) ORDER BY utilization_percent DESC"
    parameters: ["threshold"]
    example: "监控超过阈值的风险限额"
    system_types: ["risk", "trading"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "medium"
    tags: ["风险限额", "监控", "预警"]

  - name: "风险报告生成"
    category: "risk_reporting"
    description: "生成风险报告"
    template: "SELECT DATE(date) as report_date, COUNT(*) as total_positions, SUM(market_value) as total_exposure, AVG(var_1d) as avg_var, MAX(var_1d) as max_var FROM daily_risk_metrics WHERE date BETWEEN '{start_date}' AND '{end_date}' GROUP BY DATE(date) ORDER BY report_date"
    parameters: ["start_date", "end_date"]
    example: "生成每日风险报告"
    system_types: ["risk"]
    database_types: ["sqlite", "mysql", "postgresql"]
    difficulty: "medium"
    tags: ["风险报告", "统计", "监控"]

