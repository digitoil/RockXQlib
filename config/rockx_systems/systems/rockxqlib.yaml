ai_prompts:
  quant_analysis:
  - 请为量化分析生成SQL查询语句
  - 请优化这个技术指标计算查询
  - 请生成风险分析相关的SQL语句
  strategy_development:
  - 请生成双均线策略的SQL查询
  - 请计算策略回测结果的SQL
  - 请分析策略性能的SQL查询
custom_features:
  ai_integration: true
  kronos_model: true
  node_workflow: true
  visualization: true
database_config:
  mongodb:
    database: qlib_tasks
    enabled: true
    host: localhost
    port: 27017
    type: mongodb
  primary:
    path: rockxqlib.db
    tables:
    - market_data
    - strategy_config
    - backtest_result
    - user_config
    type: sqlite
  vector:
    enabled: true
    path: vector_kb
    type: vector
description: 基于Qlib的高级量化分析系统
enabled: true
sql_templates:
- 基础行情查询
- 技术指标计算
- 策略回测分析
- 风险分析
- 投资组合分析
system_name: RockXQlib
system_type: !!python/object/apply:core.rockx_universal_config.RockXSystemType
- qlib
version: '2.1'
