# 最小可跑的 qlib 实验：收盘价特征 + LGBModel + 预测记录 + IC + 回测。
# 不依赖 Alpha158，也不依赖官方 cn_data。数据目录只要是 qlib bin 布局
# （calendars/ features/ instruments/），并且里面有股票池 `pool` 和基准 SH000300。
#
#   python -m pipeline data-import prices.csv --out ./qlib_data --instrument-list pool
#   python -m pipeline qrun workflows/lgb_close_minimal.yaml --provider-uri ./qlib_data
#
# 没有数据目录时命令直接失败，不会写成功记录。
# 日期要落在你的日历里；下面这组区间与 tests/test_qlib_research.py 的小样本夹具一致。
qlib_init:
  provider_uri: ${QLIB_PROVIDER_URI}
  region: cn

market: &market pool
benchmark: &benchmark SH000300

port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy.signal_strategy
    kwargs:
      signal: <PRED>
      topk: 2
      n_drop: 1
  backtest:
    start_time: 2020-03-16
    end_time: 2020-04-29
    account: 100000000
    benchmark: *benchmark
    exchange_kwargs:
      freq: day
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

task:
  model:
    class: LGBModel
    module_path: qlib.contrib.model.gbdt
    kwargs:
      loss: mse
      learning_rate: 0.1
      num_leaves: 8
      num_boost_round: 16
      early_stopping_rounds: 8
      num_threads: 2
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: DataHandlerLP
        module_path: qlib.data.dataset.handler
        kwargs:
          start_time: 2020-01-02
          end_time: 2020-04-30
          instruments: *market
          data_loader:
            class: QlibDataLoader
            module_path: qlib.data.dataset.loader
            kwargs:
              config:
                feature:
                  - ["Ref($close, 1)/$close - 1", "Ref($close, 5)/$close - 1", "Mean($close, 5)/$close - 1"]
                  - ["RET1", "RET5", "MA5"]
                label:
                  - ["Ref($close, -2)/Ref($close, -1) - 1"]
                  - ["LABEL0"]
          infer_processors:
            - class: ProcessInf
              module_path: qlib.data.dataset.processor
            - class: Fillna
              module_path: qlib.data.dataset.processor
              kwargs:
                fields_group: feature
          learn_processors:
            - class: DropnaLabel
              module_path: qlib.data.dataset.processor
            - class: CSZScoreNorm
              module_path: qlib.data.dataset.processor
              kwargs:
                fields_group: label
      segments:
        train: [2020-01-02, 2020-02-28]
        valid: [2020-03-02, 2020-03-13]
        test: [2020-03-16, 2020-04-30]
  record:
    - class: SignalRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        model: <MODEL>
        dataset: <DATASET>
    - class: SigAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        ana_long_short: false
        ann_scaler: 252
    - class: PortAnaRecord
      module_path: qlib.workflow.record_temp
      kwargs:
        config: *port_analysis_config
