# Sandwich · Alpha360
# 由 qlib 官方基准配置自动导入，**模型超参与官方一致**（可与论文结果比对）
# 源文件: qlib 官方基准: examples/benchmarks/Sandwich/workflow_config_sandwich_Alpha360.yaml
#
# 运行:      python -m pipeline run pipelines/qlib_sandwich_alpha360.yaml --backend dry   # 先演练接线
#            python -m pipeline run pipelines/qlib_sandwich_alpha360.yaml                # 真跑（需本机有数据）
# 导入画布:  GUI「文件 → 导入工作流(JSON)」或 python -m pipeline export pipelines/qlib_sandwich_alpha360.yaml out.json
#
# 生成命令:  python -m pipeline import-benchmarks
#
# 注意:
#   - provider_uri 已替换为本机数据目录：E:\2025\RockX20251003\RockXFWV21\qlib_data\cn_data

name: qlib_sandwich_alpha360
steps:
- type: init
  props:
    provider_uri: E:\2025\RockX20251003\RockXFWV21\qlib_data\cn_data
    region: cn
- type: data
  props:
    instruments: csi300
    start_time: '2008-01-01'
    end_time: '2020-08-01'
- type: dataset
  props:
    handler_class: Alpha360
    module_path: qlib.contrib.data.handler
    instruments: csi300
    handler_kwargs:
      start_time: '2008-01-01'
      end_time: '2020-08-01'
      fit_start_time: '2008-01-01'
      fit_end_time: '2014-12-31'
      instruments: csi300
      infer_processors:
      - class: RobustZScoreNorm
        kwargs:
          fields_group: feature
          clip_outlier: true
      - class: Fillna
        kwargs:
          fields_group: feature
      learn_processors:
      - class: DropnaLabel
      - class: CSRankNorm
        kwargs:
          fields_group: label
      label:
      - Ref($close, -2) / Ref($close, -1) - 1
    train_start: '2008-01-01'
    train_end: '2014-12-31'
    valid_start: '2015-01-01'
    valid_end: '2016-12-31'
    test_start: '2017-01-01'
    test_end: '2020-08-01'
- type: model
  props:
    model_class: Sandwich
    module_path: qlib.contrib.model.pytorch_sandwich
    model_params:
      fea_dim: 6
      cnn_dim_1: 16
      cnn_dim_2: 16
      cnn_kernel_size: 3
      rnn_dim_1: 8
      rnn_dim_2: 8
      rnn_dups: 2
      rnn_layers: 2
      n_epochs: 200
      lr: 0.001
      early_stop: 20
      batch_size: 2000
      metric: loss
      GPU: 0
- type: strategy
  props:
    strategy_class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    signal: <PRED>
    strategy_params:
      topk: 50
      n_drop: 5
- type: backtest
  props:
    start_time: '2017-01-01'
    end_time: '2020-08-01'
    initial_capital: 100000000
    benchmark: SH000300
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
