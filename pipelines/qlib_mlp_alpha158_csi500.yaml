# MLP · Alpha158 · csi500
# 由 qlib 官方基准配置自动导入，**模型超参与官方一致**（可与论文结果比对）
# 源文件: qlib 官方基准: examples/benchmarks/MLP/workflow_config_mlp_Alpha158_csi500.yaml
#
# 运行:      python -m pipeline run pipelines/qlib_mlp_alpha158_csi500.yaml --backend dry   # 先演练接线
#            python -m pipeline run pipelines/qlib_mlp_alpha158_csi500.yaml                # 真跑（需本机有数据）
# 导入画布:  GUI「文件 → 导入工作流(JSON)」或 python -m pipeline export pipelines/qlib_mlp_alpha158_csi500.yaml out.json
#
# 生成命令:  python -m pipeline import-benchmarks
#
# 注意:
#   - provider_uri 已替换为本机数据目录：E:\2025\RockX20251003\RockXFWV21\qlib_data\cn_data
#   - handler_kwargs 含本工具未显式声明的键（原样透传，通常没问题）：process_type

name: qlib_mlp_alpha158_csi500
steps:
- type: init
  props:
    provider_uri: E:\2025\RockX20251003\RockXFWV21\qlib_data\cn_data
    region: cn
- type: data
  props:
    instruments: csi500
    start_time: '2008-01-01'
    end_time: '2020-08-01'
- type: dataset
  props:
    handler_class: Alpha158
    module_path: qlib.contrib.data.handler
    instruments: csi500
    handler_kwargs:
      start_time: '2008-01-01'
      end_time: '2020-08-01'
      fit_start_time: '2008-01-01'
      fit_end_time: '2014-12-31'
      instruments: csi500
      infer_processors:
      - class: DropCol
        kwargs:
          col_list:
          - VWAP0
      - class: CSZFillna
        kwargs:
          fields_group: feature
      learn_processors:
      - class: DropCol
        kwargs:
          col_list:
          - VWAP0
      - class: DropnaProcessor
        kwargs:
          fields_group: feature
      - DropnaLabel
      - class: CSZScoreNorm
        kwargs:
          fields_group: label
      process_type: independent
    train_start: '2008-01-01'
    train_end: '2014-12-31'
    valid_start: '2015-01-01'
    valid_end: '2016-12-31'
    test_start: '2017-01-01'
    test_end: '2020-08-01'
- type: model
  props:
    model_class: DNNModelPytorch
    module_path: qlib.contrib.model.pytorch_nn
    model_params:
      loss: mse
      lr: 0.002
      optimizer: adam
      max_steps: 8000
      batch_size: 8192
      GPU: 0
      weight_decay: 0.0002
      pt_model_kwargs:
        input_dim: 157
- type: strategy
  props:
    strategy_class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    signal: <PRED>
    strategy_params:
      topk: 50
      n_drop: 5
- type: backtest
  props:
    start_time: '2017-01-01'
    end_time: '2020-08-01'
    initial_capital: 100000000
    benchmark: SH000905
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
