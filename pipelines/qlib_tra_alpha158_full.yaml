# TRA · Alpha158 · full
# 由 qlib 官方基准配置自动导入，**模型超参与官方一致**（可与论文结果比对）
# 源文件: qlib 官方基准: examples/benchmarks/TRA/workflow_config_tra_Alpha158_full.yaml
#
# 运行:      python -m pipeline run pipelines/qlib_tra_alpha158_full.yaml --backend dry   # 先演练接线
#            python -m pipeline run pipelines/qlib_tra_alpha158_full.yaml                # 真跑（需本机有数据）
# 导入画布:  GUI「文件 → 导入工作流(JSON)」或 python -m pipeline export pipelines/qlib_tra_alpha158_full.yaml out.json
#
# 生成命令:  python -m pipeline import-benchmarks
#
# 注意:
#   - provider_uri 已替换为本机数据目录：E:\2025\RockX20251003\RockXFWV21\qlib_data\cn_data
#   - 官方配置里这些顶层键未映射（本工具不使用）：memory_mode, model_config, num_states, tra_config

name: qlib_tra_alpha158_full
steps:
- type: init
  props:
    provider_uri: E:\2025\RockX20251003\RockXFWV21\qlib_data\cn_data
    region: cn
- type: data
  props:
    instruments: csi300
    start_time: '2008-01-01'
    end_time: '2020-08-01'
- type: dataset
  props:
    handler_class: Alpha158
    module_path: qlib.contrib.data.handler
    instruments: csi300
    handler_kwargs:
      start_time: '2008-01-01'
      end_time: '2020-08-01'
      fit_start_time: '2008-01-01'
      fit_end_time: '2014-12-31'
      instruments: csi300
      infer_processors:
      - class: RobustZScoreNorm
        kwargs:
          fields_group: feature
          clip_outlier: true
      - class: Fillna
        kwargs:
          fields_group: feature
      learn_processors:
      - class: CSRankNorm
        kwargs:
          fields_group: label
      label:
      - Ref($close, -2) / Ref($close, -1) - 1
    train_start: '2008-01-01'
    train_end: '2014-12-31'
    valid_start: '2015-01-01'
    valid_end: '2016-12-31'
    test_start: '2017-01-01'
    test_end: '2020-08-01'
- type: model
  props:
    model_class: TRAModel
    module_path: qlib.contrib.model.pytorch_tra
    model_params:
      tra_config:
        num_states: 3
        rnn_arch: LSTM
        hidden_size: 32
        num_layers: 1
        dropout: 0.0
        tau: 1.0
        src_info: LR_TPE
      model_config:
        input_size: 158
        hidden_size: 256
        num_layers: 2
        rnn_arch: LSTM
        use_attn: true
        dropout: 0.2
      model_type: RNN
      lr: 1e-3
      n_epochs: 100
      max_steps_per_epoch: null
      early_stop: 20
      logdir: output/Alpha158_full
      seed: 0
      lamb: 1.0
      rho: 0.99
      alpha: 0.5
      transport_method: router
      memory_mode: sample
      eval_train: false
      eval_test: true
      pretrain: true
      init_state: null
      freeze_model: false
      freeze_predictors: false
- type: strategy
  props:
    strategy_class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    signal: <PRED>
    strategy_params:
      topk: 50
      n_drop: 5
- type: backtest
  props:
    start_time: '2017-01-01'
    end_time: '2020-08-01'
    initial_capital: 100000000
    benchmark: SH000300
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
