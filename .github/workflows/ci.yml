name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: 安装依赖（Qt 离屏 + NodeGraphQt，用于面板与真实节点规格测试）
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install pyyaml PySide6-Essentials NodeGraphQt
      - name: 核心纯净性守门
        run: python tests/test_core_purity.py
      - name: 流水线 / 助手 / 面板 / 规格一致性测试
        run: python -m unittest tests.test_pipeline tests.test_assistant tests.test_assistant_dock_qt tests.test_pipeline_panel_qt tests.test_specs_vs_real -v
      - name: 模板演练（接线与数据流）
        run: |
          for f in pipelines/*.yaml; do python -m pipeline run "$f" --backend dry --runs-dir /tmp/runs; done
