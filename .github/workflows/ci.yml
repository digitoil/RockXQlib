name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - name: 安装依赖（Qt 离屏 + NodeGraphQt，用于面板与真实节点规格测试）
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
          pip install pyyaml PySide6-Essentials NodeGraphQt
      - name: 核心纯净性守门
        run: python tests/test_core_purity.py
      - name: 流水线 / 助手 / 面板 / 基准导入 / 规格一致性测试
        run: python -m unittest tests.test_pipeline tests.test_assistant tests.test_assistant_dock_qt tests.test_assistant_probe_qt tests.test_pipeline_panel_qt tests.test_llm_probe tests.test_qlib_benchmarks tests.test_specs_vs_real -v
      - name: LLM 端点探测（无服务时应给出建议而非崩溃）
        run: python -m pipeline llm-check --timeout 2 || true
      - name: 模板校验（全部，含 qlib 官方基准导入的模板）
        run: |
          fail=0
          for f in pipelines/*.yaml; do
            python -m pipeline validate "$f" || { echo "校验失败: $f"; fail=1; }
          done
          exit $fail
      - name: 模板演练（代表性子集：GBDT / 线性 / PyTorch 各取一）
        run: |
          for f in pipelines/lgb_alpha158.yaml \
                   pipelines/qlib_lightgbm_alpha158.yaml \
                   pipelines/qlib_xgboost_alpha158.yaml \
                   pipelines/qlib_linear_alpha158.yaml \
                   pipelines/qlib_lstm_alpha360.yaml \
                   pipelines/qlib_transformer_alpha158.yaml; do
            echo "--- $f"
            python -m pipeline run "$f" --backend dry --runs-dir /tmp/runs
          done
      - name: 官方基准导入器自检（能发现配置即通过）
        run: python -m pipeline import-benchmarks --list
